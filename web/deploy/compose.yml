services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TLS: ${MQTT_TLS:-1}
    labels:
      # Opt into Traefik routing — without this Traefik ignores the container
      - "traefik.enable=true"
      # Route requests for this domain to this container
      - "traefik.http.routers.mokki.rule=Host(`${DOMAIN}`)"
      # Traefik entrypoint name — must match the websecure entrypoint in the host Traefik config
      - "traefik.http.routers.mokki.entrypoints=websecure"
      # Cert resolver name — must match the letsencrypt resolver in the host Traefik config
      - "traefik.http.routers.mokki.tls.certresolver=letsencrypt"
      # This turns a heat pump on and off from the public internet, so the whole
      # router sits behind basicauth. There is no unauthenticated route.
      - "traefik.http.routers.mokki.middlewares=mokki-auth"
      - "traefik.http.middlewares.mokki-auth.basicauth.users=${BASIC_AUTH_USERS}"
      # Port uvicorn listens on inside the container
      - "traefik.http.services.mokki.loadbalancer.server.port=8000"
    networks:
      - traefik

networks:
  # Shared network the host Traefik container is attached to — must be created before deploying
  traefik:
    external: true
